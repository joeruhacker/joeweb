<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Джо Хакер - Программист Матрицы</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    @keyframes neon {
      0%, 100% { 
        text-shadow: 0 0 5px #2AABEE, 0 0 10px #2AABEE, 0 0 20px #0088CC;
      }
      50% { 
        text-shadow: 0 0 10px #2AABEE, 0 0 30px #0088CC, 0 0 60px #0088CC;
      }
    }

    body {
      font-family: 'Roboto Mono', monospace;
      background: radial-gradient(circle, #2AABEE, #000000);
      color: #ffffff;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      overflow: hidden;
    }

    .content {
      text-align: center;
      max-width: 600px;
      width: 90%;
      padding: 20px;
      padding-bottom: calc(20px + env(safe-area-inset-bottom));
      transform: translateY(-3%);
      z-index: 1;
    }

    h1 {
      font-size: 48px;
      text-transform: uppercase;
      letter-spacing: 4px;
      margin-bottom: 20px;
      color: #2AABEE;
      animation: neon 4s infinite;
    }

    p.heading {
      font-size: 18px;
      margin: 30px 0 15px 0;
      line-height: 1.4;
      color: #2AABEE;
    }

    .button-wrapper {
      margin-bottom: 15px;
    }
    .button {
      display: inline-block;
      background-color: #2AABEE;
      color: #ffffff;
      text-decoration: none;
      padding: 10px 20px;
      margin-top: 10px;
      border-radius: 5px;
      transition: background-color 0.3s, transform 0.3s, box-shadow 0.3s;
      letter-spacing: 1px;
      animation: pulse 3s infinite;
      box-shadow: 0 0 10px #2AABEE, 0 0 20px #2AABEE, 0 0 30px #2AABEE;
      font-size: 14px;
    }
    .button:hover {
      background-color: #0088CC;
      transform: scale(1.05);
      box-shadow: 0 0 20px #0088CC, 0 0 30px #0088CC, 0 0 40px #0088CC;
    }

    .matrix {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      background: black;
      opacity: 0.6;
      overflow: hidden;
    }
    canvas {
      display: block;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="matrix"></div>
  <div class="content">
    <h1>Джо Хакер</h1>
    
    <div class="button-wrapper">
      <p class="heading">Связаться с Джо:</p>
      <a class="button" href="https://t.me/joe_hacker">ТЕЛЕГРАМ</a>
    </div>

    <div class="button-wrapper">
      <p class="heading">Сайт Джо:</p>
      <a class="button" href="https://joehacker.tech/" target="_blank">САЙТ ДЖО</a>
    </div>

    <div class="button-wrapper">
      <p class="heading">Заказать услугу на KWORK:</p>
      <a class="button" href="https://kwork.ru/user/joehacker">KWORK</a>
    </div>

    <div class="button-wrapper">
      <p class="heading">Посмотреть код Джо на GitHub:</p>
      <a class="button" href="https://github.com/joeruhacker">GITHUB ДЖО</a>
    </div>
  </div>

  <script>
    const canvas = document.createElement('canvas');
    const matrixContainer = document.querySelector('.matrix');
    matrixContainer.appendChild(canvas);
    const ctx = canvas.getContext('2d');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    const fontSize = 12;
    const columns = Math.floor(width / fontSize);

    const drops = Array(columns).fill(0);
    const dropsDelay = Array(columns).fill(0);
    const dropInterval = 2;

    const codeLines = [
      "def greet(name):",
      "    print(f'Hello, {name}!')",
      "class Hacker:",
      "    def __init__(self, name):",
      "        self.name = name",
      "    def hack(self):",
      "        print(f'{self.name} is hacking...')",
      "if __name__ == '__main__':",
      "    joe = Hacker('Джо')",
      "    joe.greet('Мир')",
      "    joe.hack()",
      "# Создание экземпляра класса",
      "user = Hacker('User')",
      "user.greet('Developer')",
      "user.hack()"
    ];

    function getRandomCodeLine() {
      return codeLines[Math.floor(Math.random() * codeLines.length)];
    }

    function draw() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
      ctx.fillRect(0, 0, width, height);

      ctx.fillStyle = '#2AABEE';
      ctx.font = `${fontSize}px 'Roboto Mono', monospace`;

      for (let i = 0; i < drops.length; i++) {
        if (dropsDelay[i] < dropInterval) {
          dropsDelay[i]++;
          continue;
        }
        dropsDelay[i] = 0;

        const codeLine = getRandomCodeLine();
        const charIndex = drops[i] % codeLine.length;
        const text = codeLine.charAt(charIndex) || ' ';

        const x = i * fontSize;
        const y = drops[i] * fontSize;

        ctx.fillText(text, x, y);

        if (y > height && Math.random() > 0.975) {
          drops[i] = 0;
        } else {
          drops[i]++;
        }
      }
    }

    function animate() {
      draw();
      requestAnimationFrame(animate);
    }
    animate();

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      const newColumns = Math.floor(width / fontSize);
      drops.length = newColumns;
      dropsDelay.length = newColumns;
      for (let i = 0; i < newColumns; i++) {
        drops[i] = drops[i] || 0;
        dropsDelay[i] = dropsDelay[i] || 0;
      }
    });
  </script>
</body>
</html>
