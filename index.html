<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Джо Хакер - Программист Матрицы</title>
    <!-- Подключение шрифта Roboto Mono -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        @keyframes neon {
            0%, 100% { 
                text-shadow: 
                    0 0 5px #2AABEE, 
                    0 0 10px #2AABEE, 
                    0 0 15px #2AABEE, 
                    0 0 20px #0088CC, 
                    0 0 30px #0088CC, 
                    0 0 40px #0088CC, 
                    0 0 55px #0088CC; 
            }
            50% { 
                text-shadow: 
                    0 0 10px #2AABEE, 
                    0 0 20px #2AABEE, 
                    0 0 30px #2AABEE, 
                    0 0 40px #0088CC, 
                    0 0 50px #0088CC, 
                    0 0 75px #0088CC, 
                    0 0 100px #0088CC; 
            }
        }
        html, body {
            margin: 0;
            padding: 0;
            height: 100vh; /* Высота на весь экран */
            overflow: hidden; /* Отключаем прокрутку */
        }
        body {
            font-family: 'Roboto Mono', monospace;
            background: radial-gradient(circle, #2AABEE, #000000);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            animation: fadeIn 1s ease-out;
        }
        .content {
            text-align: center;
            max-width: 600px;
            width: 100%;
            padding: 20px;
            animation: fadeIn 1.5s ease-out;
            z-index: 1; /* Контент выше анимации */
        }
        h1 {
            font-family: 'Roboto Mono', monospace;
            font-size: 48px;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 30px;
            color: #2AABEE;
            animation: neon 2s infinite;
        }
        p.heading {
            font-family: 'Roboto Mono', monospace;
            font-size: 18px;
            margin: 20px 0 10px 0;
            line-height: 1.4;
            color: #2AABEE;
            animation: fadeIn 1s forwards;
        }
        .button-wrapper {
            margin-bottom: 20px;
        }
        .button {
            font-family: 'Roboto Mono', monospace;
            display: inline-block;
            background-color: #2AABEE;
            color: #ffffff;
            text-decoration: none;
            padding: 10px 20px;
            margin-top: 10px;
            border-radius: 5px;
            transition: background-color 0.3s, transform 0.3s, box-shadow 0.3s;
            letter-spacing: 1px;
            animation: pulse 1.5s infinite;
            box-shadow: 0 0 10px #2AABEE, 0 0 20px #2AABEE, 0 0 30px #2AABEE;
            font-size: 14px;
        }
        .button:hover {
            background-color: #0088CC;
            transform: scale(1.05);
            box-shadow: 0 0 20px #0088CC, 0 0 30px #0088CC, 0 0 40px #0088CC;
        }
        .matrix {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: black;
            opacity: 0.6; /* затемнённый фон */
            overflow: hidden;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <div class="matrix"></div>
    <div class="content">
        <h1>Джо Хакер</h1>
        
        <div class="button-wrapper">
            <p class="heading">Связаться с Джо:</p>
            <a class="button" href="https://t.me/joe_hacker">ТЕЛЕГРАМ</a>
        </div>

        <div class="button-wrapper">
            <p class="heading">Канал Джо с новостями мира хакинга:</p>
            <a class="button" href="https://t.me/joe_hacker_canal">КАНАЛ В ТЕЛЕГРАМЕ</a>
        </div>

        <div class="button-wrapper">
            <p class="heading">Заказать услугу на KWORK:</p>
            <a class="button" href="https://kwork.ru/user/joehacker">KWORK</a>
        </div>
        
        <div class="button-wrapper">
            <p class="heading">Заказать услугу на Хабр:</p>
            <a class="button" href="https://freelance.habr.com/freelancers/joehacker">ХАБР</a>
        </div>

        <div class="button-wrapper">
            <p class="heading">Посмотреть код Джо на GitHub:</p>
            <a class="button" href="https://github.com/joeruhacker">GITHUB ДЖО</a>
        </div>
    </div>

    <script>
        // Matrix Effect с использованием Python-кода
        const canvas = document.createElement('canvas');
        const matrixContainer = document.querySelector('.matrix');
        matrixContainer.appendChild(canvas);
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        // Размер шрифта и расчет количества столбцов
        const fontSize = 12; 
        let columns = Math.floor(width / fontSize);

        // Массив для отслеживания позиций каждого столбца
        const drops = Array(columns).fill(0);

        // Список строк Python-кода
        const codeLines = [
            "def greet(name):",
            "    print(f'Hello, {name}!')",
            "",
            "class Hacker:",
            "    def __init__(self, name):",
            "        self.name = name",
            "",
            "    def hack(self):",
            "        print(f'{self.name} is hacking...')",
            "",
            "if __name__ == '__main__':",
            "    joe = Hacker('Джо')",
            "    joe.greet('Мир')",
            "    joe.hack()",
            "",
            "# Создание экземпляра класса",
            "user = Hacker('User')",
            "user.greet('Developer')",
            "user.hack()"
        ];

        // Случайная строка кода
        function getRandomCodeLine() {
            return codeLines[Math.floor(Math.random() * codeLines.length)];
        }

        // Рисуем
        function draw() {
            // Полупрозрачная заливка для эффекта затухания
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, width, height);

            // Цвет символов
            ctx.fillStyle = '#2AABEE';
            ctx.font = fontSize + 'px monospace';

            // Перебираем все столбцы
            for (let i = 0; i < drops.length; i++) {
                const codeLine = getRandomCodeLine();
                const charIndex = drops[i] % codeLine.length;
                const text = codeLine.charAt(charIndex) || ' ';

                const x = i * fontSize;
                const y = drops[i] * fontSize;

                ctx.fillText(text, x, y);

                // Сброс столбца
                if (y > height && Math.random() > 0.999) {
                    drops[i] = 0;
                } else {
                    drops[i]++;
                }
            }
        }

        // Анимация
        function animate() {
            draw();
            requestAnimationFrame(animate);
        }

        animate();

        // При изменении размера окна
        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            columns = Math.floor(width / fontSize);
            drops.length = columns;
            for (let i = 0; i < columns; i++) {
                drops[i] = drops[i] || 0;
            }
        });
    </script>
</body>
</html>
