<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Джо Хакер - Программист Матрицы</title>
    <!-- Подключение шрифта Roboto Mono -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        @keyframes neon {
            0%, 100% { 
                text-shadow: 
                    0 0 5px #2AABEE, 
                    0 0 10px #2AABEE, 
                    0 0 15px #2AABEE, 
                    0 0 20px #0088CC, 
                    0 0 30px #0088CC, 
                    0 0 40px #0088CC, 
                    0 0 55px #0088CC; 
            }
            50% { 
                text-shadow: 
                    0 0 10px #2AABEE, 
                    0 0 20px #2AABEE, 
                    0 0 30px #2AABEE, 
                    0 0 40px #0088CC, 
                    0 0 50px #0088CC, 
                    0 0 75px #0088CC, 
                    0 0 100px #0088CC; 
            }
        }
        body {
            font-family: 'Roboto Mono', monospace; /* Применение Roboto Mono ко всему телу */
            background: radial-gradient(circle, #2AABEE, #000000);
            color: #ffffff;
            margin: 0;
            padding: 0;
            min-height: 100vh; /* Используем min-height вместо height */
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            animation: fadeIn 1s ease-out;
            overflow-y: auto; /* Разрешаем вертикальную прокрутку */
            position: relative; /* Для позиционирования кнопки "Назад" */
        }
        .content {
            text-align: center;
            max-width: 600px;
            width: 100%;
            padding: 20px;
            animation: fadeIn 1.5s ease-out;
            z-index: 1; /* Обеспечивает, что контент выше анимации */
        }
        h1 {
            font-family: 'Roboto Mono', monospace; /* Применение Roboto Mono */
            font-size: 48px;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 30px;
            color: #2AABEE;
            animation: neon 2s infinite;
        }
        p.heading {
            font-family: 'Roboto Mono', monospace; /* Применение Roboto Mono */
            font-size: 18px; /* Уменьшенный размер шрифта */
            margin: 20px 0 10px 0;
            line-height: 1.4;
            color: #2AABEE;
            animation: fadeIn 1s forwards;
        }
        .button-wrapper {
            margin-bottom: 20px;
        }
        .button {
            font-family: 'Roboto Mono', monospace; /* Применение Roboto Mono */
            display: inline-block;
            background-color: #2AABEE;
            color: #ffffff;
            text-decoration: none;
            padding: 10px 20px;
            margin-top: 10px;
            border-radius: 5px;
            transition: background-color 0.3s, transform 0.3s, box-shadow 0.3s;
            letter-spacing: 1px;
            animation: pulse 1.5s infinite;
            box-shadow: 0 0 10px #2AABEE, 0 0 20px #2AABEE, 0 0 30px #2AABEE;
            font-size: 14px; /* Уменьшенный размер шрифта */
        }
        .button:hover {
            background-color: #0088CC;
            transform: scale(1.05);
            box-shadow: 0 0 20px #0088CC, 0 0 30px #0088CC, 0 0 40px #0088CC;
        }
        .matrix {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: black;
            opacity: 0.6; /* Сниженная яркость фона */
            overflow: hidden;
        }
        canvas {
            display: block;
        }
        /* Стили для кнопки "Назад" */
        .back-button {
            position: fixed;
            top: 20px;
            left: 20px;
            background-color: #2AABEE;
            color: #ffffff;
            border: none;
            border-radius: 5px;
            padding: 8px 12px;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            box-shadow: 0 0 10px #2AABEE, 0 0 20px #2AABEE, 0 0 30px #2AABEE;
            transition: background-color 0.3s, transform 0.3s, box-shadow 0.3s;
            z-index: 2; /* Поверх iframe */
            display: none; /* Скрыта по умолчанию */
        }
        .back-button:hover {
            background-color: #0088CC;
            transform: scale(1.05);
            box-shadow: 0 0 20px #0088CC, 0 0 30px #0088CC, 0 0 40px #0088CC;
        }
        .back-button svg {
            margin-right: 5px;
        }
        /* Стили для iframe */
        .iframe-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            display: none; /* Скрыт по умолчанию */
        }
        .iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div class="matrix"></div>
    <div class="content">
        <h1>Джо Хакер</h1>
        
        <div class="button-wrapper">
            <p class="heading">Связаться с Джо:</p>
            <a class="button" href="https://t.me/joe_hacker">ТЕЛЕГРАМ</a>
        </div>

        <div class="button-wrapper">
            <p class="heading">Канал Джо с новостями мира хакинга:</p>
            <a class="button" href="https://t.me/joe_hacker_canal">КАНАЛ В ТЕЛЕГРАМЕ</a>
        </div>

        <div class="button-wrapper">
            <p class="heading">Заказать услугу на KWORK:</p>
            <a class="button" href="https://kwork.ru/user/joehacker" onclick="openIframe(event, 'https://kwork.ru/user/joehacker')">KWORK</a>
        </div>
        
        <div class="button-wrapper">
            <p class="heading">Заказать услугу на Хабр:</p>
            <a class="button" href="https://freelance.habr.com/freelancers/joehacker" onclick="openIframe(event, 'https://freelance.habr.com/freelancers/joehacker')">ХАБР</a>
        </div>

        <div class="button-wrapper">
            <p class="heading">Посмотреть код Джо на GitHub:</p>
            <a class="button" href="https://github.com/joeruhacker" onclick="openIframe(event, 'https://github.com/joeruhacker')">GITHUB ДЖО</a>
        </div>
    </div>

    <!-- Кнопка "Назад" -->
    <button class="back-button" onclick="closeIframe()">
        <!-- Иконка стрелки назад (SVG) -->
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-left" viewBox="0 0 16 16">
            <path fill-rule="evenodd" d="M15 8a.5.5 0 0 1-.5.5H2.707l3.147 3.146a.5.5 0 0 1-.708.708l-4-4a.5.5 0 0 1 0-.708l4-4a.5.5 0 1 1 .708.708L2.707 7.5H14.5A.5.5 0 0 1 15 8z"/>
        </svg>
        Назад
    </button>

    <!-- Контейнер для iframe -->
    <div class="iframe-container" id="iframe-container">
        <iframe src="" id="external-iframe"></iframe>
    </div>

    <script>
        // Matrix Effect с использованием Python-кода
        const canvas = document.createElement('canvas');
        const matrixContainer = document.querySelector('.matrix');
        matrixContainer.appendChild(canvas);
        const ctx = canvas.getContext('2d');

        // Установка размеров канваса
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        // Размер шрифта и расчет количества столбцов
        const fontSize = 12; // Уменьшенный размер шрифта
        const columns = Math.floor(width / fontSize);

        // Массив для отслеживания позиций каждого столбца
        const drops = Array(columns).fill(0);

        // Список строк Python-кода
        const codeLines = [
            "def greet(name):",
            "    print(f'Hello, {name}!')",
            "",
            "class Hacker:",
            "    def __init__(self, name):",
            "        self.name = name",
            "",
            "    def hack(self):",
            "        print(f'{self.name} is hacking...')",
            "",
            "if __name__ == '__main__':",
            "    joe = Hacker('Джо')",
            "    joe.greet('Мир')",
            "    joe.hack()",
            "",
            "# Создание экземпляра класса",
            "user = Hacker('User')",
            "user.greet('Developer')",
            "user.hack()"
        ];

        // Функция для случайного выбора строки кода
        function getRandomCodeLine() {
            return codeLines[Math.floor(Math.random() * codeLines.length)];
        }

        // Функция для рисования
        function draw() {
            // Полупрозрачная заливка для эффекта затухания
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, width, height);

            // Синий цвет для символов
            ctx.fillStyle = '#2AABEE'; // Синий цвет, как в примере
            ctx.font = `${fontSize}px monospace`;

            // Перебор всех столбцов
            for (let i = 0; i < drops.length; i++) {
                // Выбор случайной строки кода
                const codeLine = getRandomCodeLine();
                const charIndex = drops[i] % codeLine.length;
                const text = codeLine.charAt(charIndex) || ' ';
                
                // Позиция символа
                const x = i * fontSize;
                const y = drops[i] * fontSize;

                // Рисование символа
                ctx.fillText(text, x, y);

                // Обновление позиции
                if (y > height && Math.random() > 0.999) { // Уменьшена скорость сброса
                    drops[i] = 0;
                } else {
                    drops[i]++;
                }
            }
        }

        // Использование requestAnimationFrame для плавной анимации
        function animate() {
            draw();
            requestAnimationFrame(animate);
        }

        animate();

        // Обновление размеров канваса при изменении размера окна
        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            // Пересчет количества столбцов
            const newColumns = Math.floor(width / fontSize);
            drops.length = newColumns;
            for (let i = 0; i < newColumns; i++) {
                drops[i] = drops[i] || 0;
            }
        });

        // Функции для открытия и закрытия iframe
        function openIframe(event, url) {
            event.preventDefault(); // Предотвращаем стандартное поведение ссылки
            document.getElementById('external-iframe').src = url;
            document.getElementById('iframe-container').style.display = 'block';
            document.querySelector('.content').style.display = 'none';
            document.querySelector('.back-button').style.display = 'flex';
        }

        function closeIframe() {
            document.getElementById('external-iframe').src = '';
            document.getElementById('iframe-container').style.display = 'none';
            document.querySelector('.content').style.display = 'block';
            document.querySelector('.back-button').style.display = 'none';
        }
    </script>
</body>
</html>
